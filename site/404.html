<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Not found — Games and AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script>
    // gamesandai.org used to be the Substack. GitHub Pages can't issue
    // redirects, so old newsletter URLs are forwarded from here.
    (function () {
      var p = location.pathname;
      if (/^\/p\//.test(p) || /^\/(archive|subscribe)\/?$/.test(p)) {
        location.replace('https://newsletter.gamesandai.org' + p + location.search + location.hash);
      }
    })();
  </script>
  <!-- Served at any depth, so styles are inline rather than linked. -->
  <style>
    :root { color-scheme: light; --bg: #fbfaf8; --fg: #1b1a18; --fg-muted: #5e5a54; --accent: #a8452a; }
    @media (prefers-color-scheme: dark) {
      :root { color-scheme: dark; --bg: #14130f; --fg: #edeae4; --fg-muted: #a09a90; --accent: #e08b6c; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 1.0625rem/1.65 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { width: min(100% - 2.5rem, 68ch); margin: 0 auto; padding: 4rem 0; }
    h1 { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; font-weight: 600; font-size: clamp(2rem, 1.4rem + 2.2vw, 2.9rem); line-height: 1.2; margin: 0 0 0.6rem; }
    p { color: var(--fg-muted); }
    a { color: inherit; text-underline-offset: 0.18em; }
    a:hover { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>That address doesn't lead anywhere on this site. Try the <a href="/">home page</a> or the <a href="/learn/">Learn section</a>. Looking for an old newsletter post? Those live at <a href="https://newsletter.gamesandai.org">newsletter.gamesandai.org</a>.</p>
  </main>
</body>
</html>
